<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070b18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Cobaya Golosa · Navidad</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="game" aria-label="Cobaya Golosa, minijuego navideño"></canvas>

  <button
    type="button"
    class="mute-btn"
    id="mute-btn"
    role="switch"
    aria-checked="true"
    aria-label="Sonido"
    aria-keyshortcuts="M"
    title="Silenciar sonido (M)"
  >
    <svg class="mute-icon mute-icon-on" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9.2v5.6h3.6L13 19V5L7.6 9.2H4Z" fill="currentColor" />
      <path d="M16 8.6a4.8 4.8 0 0 1 0 6.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      <path d="M18.4 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
    <svg class="mute-icon mute-icon-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
      <path d="M4 9.2v5.6h3.6L13 19V5L7.6 9.2H4Z" fill="currentColor" />
      <path d="M16.2 9.2 21 14M21 9.2l-4.8 4.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
    </svg>
  </button>

  <div class="overlay" id="overlay" role="dialog" aria-live="polite" hidden>
    <section class="panel" id="panel">
      <p class="eyebrow" id="ov-eyebrow"></p>
      <h1 class="title" id="ov-title"></h1>
      <p class="text" id="ov-text"></p>
      <div class="stats" id="ov-stats"></div>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="ov-primary"></button>
        <button type="button" class="btn btn-ghost" id="ov-secondary" hidden></button>
      </div>
      <p class="tips" id="ov-tips"></p>
    </section>
  </div>

  <script src="game.js" defer></script>
</body>
</html>
